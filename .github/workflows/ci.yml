name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moldpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moldpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOLD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/moldpilot_test
      AGENT_MIGRATION_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/moldpilot_test
      AGENT_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build:mold
        working-directory: web
      - run: npm run build:template
        working-directory: web
